<div class="row">
  <div class="col-md-5">
    <h2>Контакты</h2>
    <ul class="list-group">
      <li class="list-group-item" *ngFor="let contact of contacts" 
          (click)="selectContact(contact)" 
          [class.active]="contact === selectedContact"
          style="cursor: pointer;">
        {{contact.username || '(без имени)'}}
      </li>
    </ul>
    <button class="btn btn-warning mt-2" (click)="createNewContact()">Новый контакт</button>
  </div>
  <div class="col-md-6 offset-md-1">
    <app-contact-details 
      [contact]="selectedContact" 
      [createHandler]="addContact" 
      [updateHandler]="updateContact" 
      [deleteHandler]="deleteContact">
    </app-contact-details>
  </div>
</div>
