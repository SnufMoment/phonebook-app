<div *ngIf="contact" class="row">
  <div class="col-md-12">
    <h3 *ngIf="contact._id">Детали контакта</h3>
    <h2 *ngIf="!contact._id">Новый контакт</h2>
  </div>
</div>
<div *ngIf="contact" class="row mt-3">
  <form class="col-md-12">
    <div class="mb-3">
      <label class="form-label">Имя пользователя</label>
      <input class="form-control" name="username" [(ngModel)]="contact.username" placeholder="Username"/>
    </div>
    <div class="mb-3">
      <label class="form-label">Электронная почта</label>
      <input class="form-control" name="useremail" [(ngModel)]="contact.email" placeholder="email@example.com"/>
    </div>
    <div class="mb-3">
      <label class="form-label">Мобильный телефон</label>
      <input class="form-control" name="userphonemobile" [(ngModel)]="contact.phone.mobile" placeholder="+79999999999"/>
    </div>
    <div class="mb-3">
      <label class="form-label">Рабочий телефон</label>
      <input class="form-control" name="userphonework" [(ngModel)]="contact.phone.work" placeholder="+78888888888"/>
    </div>
    
    <button class="btn btn-primary me-2" *ngIf="!contact._id" (click)="createContact(contact)">Создать</button>
    <button class="btn btn-info me-2" *ngIf="contact._id" (click)="updateContact(contact)">Обновить</button>
    <button class="btn btn-danger" *ngIf="contact._id" (click)="deleteContact(contact._id!)">Удалить</button>
  </form>
</div>
